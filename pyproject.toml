[project]
name = "meta-agent"
version = "0.1.0"
description = "Dynamic Meta-Agent System"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1.0",
    "langchain-google-genai>=2.0,<5.0",
    "redis>=5.0,<6.0",
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "docker>=7.0,<8.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = ["*.html"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

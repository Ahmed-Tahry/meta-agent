<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meta-agent dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }

  /* top bar */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #484f58; }
  .brand-dot.running { background: #22c55e; animation: blink 1.2s infinite; }
  .brand-dot.done    { background: #22c55e; }
  .brand-dot.failed  { background: #ef4444; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .task-pill { font-size: 12px; color: #8b949e; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

  /* input */
  .input-wrap {
    margin-bottom: 1.5rem;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #161b22;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: #58a6ff; }
  .input-wrap textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    color: #e6edf3;
    line-height: 1.5;
    min-height: 22px;
    max-height: 120px;
    overflow-y: auto;
    padding: 0;
  }
  .input-wrap textarea::placeholder { color: #484f58; }
  .run-btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: transparent;
    color: #e6edf3;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .run-btn:hover { background: #21262d; }
  .run-btn:disabled { color: #484f58; cursor: not-allowed; }

  /* pipeline */
  .pipeline {
    display: flex;
    margin-bottom: 1.5rem;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    overflow: hidden;
  }
  .pipe-step { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid #21262d; transition: background 0.2s; }
  .pipe-step:last-child { border-right: none; }
  .pipe-step .ps-label { font-size: 11px; color: #484f58; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
  .pipe-step .ps-icon { font-size: 18px; color: #484f58; }
  .pipe-step.ps-running { background: #161b22; }
  .pipe-step.ps-running .ps-icon  { color: #58a6ff; animation: blink 1s infinite; }
  .pipe-step.ps-running .ps-label { color: #58a6ff; }
  .pipe-step.ps-done .ps-icon  { color: #3fb950; }
  .pipe-step.ps-done .ps-label { color: #3fb950; }
  .pipe-step.ps-failed .ps-icon  { color: #f85149; }
  .pipe-step.ps-failed .ps-label { color: #f85149; }

  /* body grid */
  .body-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 12px; margin-bottom: 12px; }

  .panel { background: #161b22; border: 1px solid #21262d; border-radius: 8px; overflow: hidden; }
  .panel-head {
    padding: 10px 14px;
    border-bottom: 1px solid #21262d;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-head-label { font-size: 12px; font-weight: 500; color: #8b949e; text-transform: uppercase; letter-spacing: 0.4px; }
  .panel-body { padding: 10px; }

  .empty { padding: 32px 16px; text-align: center; color: #484f58; font-size: 13px; }
  .empty i { font-size: 24px; display: block; margin-bottom: 8px; }

  /* agents */
  .agent-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-radius: 4px; }
  .agent-row + .agent-row { border-top: 1px solid #21262d; }
  .agent-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    background: #21262d; color: #8b949e; border: 1px solid #30363d;
  }
  .agent-icon.running { background: #0d2d4a; color: #58a6ff; border-color: #1f6feb; }
  .agent-icon.done    { background: #0d3320; color: #3fb950; border-color: #238636; }
  .agent-icon.failed  { background: #3d1f1f; color: #f85149; border-color: #da3633; }
  .agent-meta { flex: 1; min-width: 0; }
  .agent-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .agent-name { font-size: 13px; font-weight: 500; }
  .agent-role-badge { font-size: 11px; color: #8b949e; background: #21262d; padding: 1px 7px; border-radius: 8px; }
  .agent-status-text { font-size: 12px; color: #484f58; }
  .agent-tools-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tool-chip {
    font-size: 11px; padding: 1px 8px; border-radius: 4px;
    background: #21262d; color: #8b949e;
    display: flex; align-items: center; gap: 3px;
  }
  .tool-chip.called  { background: #0d3320; color: #3fb950; }
  .tool-chip.errored { background: #3d1f1f; color: #f85149; }

  /* events */
  .event-list { max-height: 220px; overflow-y: auto; }
  .evt { display: flex; gap: 8px; padding: 5px 8px; font-size: 12px; font-family: 'SFMono-Regular', Consolas, monospace; color: #8b949e; }
  .evt + .evt { border-top: 1px solid #21262d; }
  .evt-time { color: #484f58; flex-shrink: 0; }
  .evt-msg { word-break: break-word; }
  .c-info { color: #58a6ff; }
  .c-good { color: #3fb950; }
  .c-bad  { color: #f85149; }
  .c-hi   { color: #e6edf3; }

  /* result */
  .result-panel { background: #161b22; border: 1px solid #238636; border-radius: 8px; overflow: hidden; display: none; }
  .result-head { padding: 10px 14px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 8px; }
  .result-head i { color: #3fb950; font-size: 16px; }
  .result-head-label { font-size: 12px; font-weight: 500; color: #3fb950; text-transform: uppercase; letter-spacing: 0.4px; }
  .result-body { padding: 16px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <div class="brand">
      <div class="brand-dot" id="brandDot"></div>
      meta-agent
    </div>
    <div class="task-pill" id="taskPill">no active task</div>
  </div>

  <div class="input-wrap" id="inputWrap">
    <textarea id="goalInput" rows="1" placeholder="Enter a goal…"></textarea>
    <button class="run-btn" id="runBtn" onclick="run()">
      <i class="ti ti-player-play"></i> run
    </button>
  </div>

  <div class="pipeline">
    <div class="pipe-step" id="ps-planner">
      <div class="ps-label">planner</div>
      <i class="ti ti-list-tree ps-icon"></i>
    </div>
    <div class="pipe-step" id="ps-spawner">
      <div class="ps-label">spawner</div>
      <i class="ti ti-sitemap ps-icon"></i>
    </div>
    <div class="pipe-step" id="ps-executor">
      <div class="ps-label">executor</div>
      <i class="ti ti-bolt ps-icon"></i>
    </div>
    <div class="pipe-step" id="ps-evaluator">
      <div class="ps-label">evaluator</div>
      <i class="ti ti-checkup-list ps-icon"></i>
    </div>
    <div class="pipe-step" id="ps-synthesizer">
      <div class="ps-label">synthesizer</div>
      <i class="ti ti-wand ps-icon"></i>
    </div>
  </div>

  <div class="body-grid">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-label">agents</span>
        <span id="agentCount" style="font-size:12px;color:#484f58;">0</span>
      </div>
      <div class="panel-body" id="agentsBody">
        <div class="empty" id="agentsEmpty">
          <i class="ti ti-circles-relation"></i>
          agents will appear as they are created
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-label">events</span>
      </div>
      <div class="panel-body event-list" id="eventsList">
        <div class="empty" style="padding:24px 8px;" id="eventsEmpty">
          <i class="ti ti-activity"></i>
          waiting…
        </div>
      </div>
    </div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="result-head">
      <i class="ti ti-circle-check"></i>
      <span class="result-head-label">result</span>
    </div>
    <div class="result-body" id="resultBody"></div>
  </div>

</div>
<script>
const textarea = document.getElementById('goalInput');

function autoResize() {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}
textarea.addEventListener('input', autoResize);
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
});

let src = null, agentMap = {}, agentCount = 0;
const ts = () => new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

function addEvent(msg, cls = '') {
  const list = document.getElementById('eventsList');
  document.getElementById('eventsEmpty')?.remove();
  const e = document.createElement('div');
  e.className = 'evt';
  e.innerHTML = `<span class="evt-time">${ts()}</span><span class="evt-msg">${cls ? `<span class="${cls}">` : ''}${msg}${cls ? '</span>' : ''}</span>`;
  list.appendChild(e);
  list.scrollTop = list.scrollHeight;
}

function setDot(state) {
  document.getElementById('brandDot').className = 'brand-dot' + (state ? ' ' + state : '');
}

function setPipeStep(name, state) {
  const el = document.getElementById('ps-' + name);
  if (el) el.className = 'pipe-step' + (state ? ' ps-' + state : '');
}

function addAgent(id, role) {
  if (agentMap[id]) return;
  const body = document.getElementById('agentsBody');
  document.getElementById('agentsEmpty')?.remove();
  agentCount++;
  document.getElementById('agentCount').textContent = agentCount;
  const row = document.createElement('div');
  row.className = 'agent-row';
  row.id = 'ar-' + id;
  row.innerHTML = `
    <div class="agent-icon" id="ai-${id}"><i class="ti ti-robot"></i></div>
    <div class="agent-meta">
      <div class="agent-name-row">
        <span class="agent-name">${id}</span>
        <span class="agent-role-badge">${role}</span>
      </div>
      <div class="agent-status-text" id="as-${id}">pending</div>
      <div class="agent-tools-wrap" id="at-${id}"></div>
    </div>`;
  body.appendChild(row);
  agentMap[id] = new Set();
}

function setAgentState(id, state, detail = '') {
  const icon = document.getElementById('ai-' + id);
  const status = document.getElementById('as-' + id);
  if (!icon || !status) return;
  icon.className = 'agent-icon' + (state ? ' ' + state : '');
  const iconMap = { running: 'ti-loader-2', done: 'ti-check', failed: 'ti-x' };
  icon.innerHTML = `<i class="ti ${iconMap[state] || 'ti-robot'}"></i>`;
  status.textContent = detail || state;
  status.style.color = state === 'running' ? '#58a6ff' : state === 'done' ? '#3fb950' : state === 'failed' ? '#f85149' : '#484f58';
}

function addToolChip(agentId, tool) {
  const wrap = document.getElementById('at-' + agentId);
  if (!wrap || agentMap[agentId]?.has(tool)) return;
  agentMap[agentId]?.add(tool);
  const chip = document.createElement('span');
  chip.className = 'tool-chip called';
  chip.id = `tc-${agentId}-${tool.replace(/\W/g, '-')}`;
  chip.innerHTML = `<i class="ti ti-check"></i>${tool}`;
  wrap.appendChild(chip);
}

function showResult(html) {
  const p = document.getElementById('resultPanel');
  document.getElementById('resultBody').innerHTML = html;
  p.style.display = 'block';
  p.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function run() {
  const goal = textarea.value.trim();
  if (!goal) return;
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> running';

  ['planner', 'spawner', 'executor', 'evaluator', 'synthesizer'].forEach(n => setPipeStep(n, ''));
  document.getElementById('agentsBody').innerHTML = '<div class="empty" id="agentsEmpty"><i class="ti ti-circles-relation"></i>agents will appear as they are created</div>';
  document.getElementById('eventsList').innerHTML = '<div class="empty" style="padding:24px 8px;" id="eventsEmpty"><i class="ti ti-activity"></i>connecting…</div>';
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('taskPill').textContent = 'starting…';
  agentMap = {}; agentCount = 0;
  document.getElementById('agentCount').textContent = '0';
  if (src) { src.close(); src = null; }
  setDot('running');

  try {
    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    document.getElementById('taskPill').textContent = data.task_id;
    addEvent(`task <span class="c-hi">${data.task_id}</span> started`, 'c-info');
    connectSSE(data.task_id);
  } catch (err) {
    addEvent('failed to start: ' + err.message, 'c-bad');
    setDot('failed');
    resetBtn();
  }
}

function connectSSE(taskId) {
  if (src) src.close();
  src = new EventSource('/tasks/' + taskId + '/stream');

  src.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    setDot(d.status);
  });

  src.addEventListener('node', e => {
    const d = JSON.parse(e.data);
    setPipeStep(d.node, d.status === 'running' ? 'running' : d.status === 'done' ? 'done' : 'failed');
    if (d.status === 'done' && d.node === 'planner' && d.output)
      addEvent(`planner → <span class="c-hi">${d.output.length}</span> subtasks`, 'c-info');
  });

  src.addEventListener('subtask', e => {
    const d = JSON.parse(e.data);
    if (d.status === 'running') {
      addAgent(d.agent_id, d.role || 'agent');
      setAgentState(d.agent_id, 'running', 'running');
      addEvent(`<span class="c-hi">${d.agent_id}</span> started`);
    } else if (d.status === 'done') {
      setAgentState(d.agent_id, 'done', 'done');
      addEvent(`<span class="c-hi">${d.agent_id}</span> done`, 'c-good');
    } else if (d.status === 'retrying') {
      setAgentState(d.agent_id, 'running', `retry ${d.attempt}`);
      addEvent(`<span class="c-hi">${d.agent_id}</span> retrying (${d.attempt})`);
    }
  });

  src.addEventListener('tool_call', e => {
    const d = JSON.parse(e.data);
    addToolChip(d.agent_id, d.tool);
    addEvent(`<span class="c-hi">${d.agent_id}</span> → ${d.tool}`);
  });

  src.addEventListener('error', e => {
    const d = JSON.parse(e.data);
    const who = d.subtask_id || d.node || 'system';
    addEvent(`${who}: ${d.message}`, 'c-bad');
    if (d.subtask_id) setAgentState(d.subtask_id, 'failed', 'failed');
  });

  src.addEventListener('complete', e => {
    const d = JSON.parse(e.data);
    addEvent('task complete', 'c-good');
    showResult(d.result || '');
    setDot('done');
    cleanup();
  });

  src.onerror = () => {
    if (src.readyState === EventSource.CLOSED) {
      addEvent('connection closed');
      cleanup();
    }
  };
}

function resetBtn() {
  const btn = document.getElementById('runBtn');
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-player-play"></i> run';
}

function cleanup() {
  if (src) { src.close(); src = null; }
  resetBtn();
}
</script>
</body>
</html>

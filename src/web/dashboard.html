<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meta-agent dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }

  /* header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid #21262d;
  }
  .header h1 {
    font-size: 20px; font-weight: 600; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  .header h1 .logo { color: #58a6ff; font-size: 22px; }
  .task-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #8b949e; }
  .task-id { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; color: #e6edf3; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500;
  }
  .status-idle { background: #21262d; color: #8b949e; }
  .status-running { background: #1f3a1f; color: #3fb950; }
  .status-done { background: #1f3a1f; color: #3fb950; }
  .status-failed { background: #3d1f1f; color: #f85149; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-running { background: #3fb950; animation: pulse 1.2s ease-in-out infinite; }
  .dot-done { background: #3fb950; }
  .dot-failed { background: #f85149; }
  .dot-idle { background: #484f58; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* input */
  .input-bar {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .input-bar input {
    flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #30363d;
    background: #161b22; color: #e6edf3; font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .input-bar input:focus { border-color: #58a6ff; }
  .input-bar input::placeholder { color: #484f58; }
  .input-bar button {
    padding: 10px 20px; border-radius: 6px; border: none;
    background: #238636; color: #fff; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background 0.15s; white-space: nowrap;
  }
  .input-bar button:hover { background: #2ea043; }
  .input-bar button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  /* panels */
  .panels { display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: #161b22; border: 1px solid #21262d; border-radius: 8px; overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid #21262d;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e;
  }
  .panel-body { padding: 8px; }

  /* steps */
  .step { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
  .step + .step { border-top: 1px solid #21262d; }
  .step-icon { width: 18px; text-align: center; font-size: 12px; flex-shrink: 0; }
  .step-name { font-weight: 500; min-width: 90px; }
  .step-status { color: #8b949e; font-size: 12px; margin-left: auto; }
  .step-waiting { color: #484f58; }
  .step-running { color: #e6edf3; }
  .step-done { color: #3fb950; }
  .step-failed { color: #f85149; }

  /* agents */
  .agent-card {
    padding: 10px; border-radius: 6px; margin: 4px;
    border: 1px solid #21262d; transition: border-color 0.2s;
  }
  .agent-card.pending { opacity: 0.5; }
  .agent-card.running { border-color: #1f6feb; }
  .agent-card.done { border-color: #238636; }
  .agent-card.failed { border-color: #da3633; }
  .agent-header {
    display: flex; align-items: center; gap: 10px;
  }
  .agent-role {
    font-size: 11px; color: #8b949e; background: #21262d;
    padding: 1px 7px; border-radius: 8px; font-weight: 500;
  }
  .agent-name { font-weight: 600; font-size: 14px; }
  .agent-status-text { font-size: 12px; margin-left: auto; }
  .agent-depends { font-size: 11px; color: #484f58; margin-top: 4px; margin-left: 28px; }

  /* tools within agent */
  .agent-tools { margin-top: 6px; margin-left: 28px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tool-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px; border-radius: 4px; font-size: 11px;
    background: #21262d; color: #8b949e;
  }
  .tool-chip.called { background: #0d5320; color: #3fb950; }
  .tool-chip.errored { background: #3d1f1f; color: #f85149; }

  /* events */
  .event-list { max-height: 200px; overflow-y: auto; }
  .event-entry {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 4px 8px; font-size: 12px; font-family: 'SFMono-Regular', Consolas, monospace;
    color: #8b949e;
  }
  .event-entry + .event-entry { border-top: 1px solid #21262d; }
  .event-time { color: #484f58; white-space: nowrap; flex-shrink: 0; }
  .event-msg { word-break: break-word; }
  .event-msg .highlight { color: #e6edf3; }
  .event-msg .good { color: #3fb950; }
  .event-msg .bad { color: #f85149; }
  .event-msg .info { color: #58a6ff; }

  /* result */
  .result-box {
    padding: 14px; line-height: 1.7; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .result-box h1, .result-box h2, .result-box h3 { color: #e6edf3; margin: 12px 0 6px; }
  .result-box h1 { font-size: 18px; }
  .result-box h2 { font-size: 16px; }
  .result-box h3 { font-size: 14px; }
  .result-box p { margin: 6px 0; }
  .result-box code {
    background: #21262d; padding: 1px 5px; border-radius: 3px; font-size: 13px; color: #f0c674;
  }
  .result-box pre {
    background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0;
    border: 1px solid #21262d;
  }
  .result-box pre code { background: none; padding: 0; }
  .result-box ul, .result-box ol { padding-left: 20px; margin: 6px 0; }

  /* empty state */
  .empty-state {
    text-align: center; padding: 40px 20px; color: #484f58; font-size: 14px;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="logo">◉</span> meta-agent dashboard</h1>
    <div class="task-info">
      <span class="task-id" id="taskId">—</span>
      <span class="status-badge status-idle" id="statusBadge">
        <span class="dot dot-idle"></span> idle
      </span>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="goalInput" placeholder="Enter a goal for the meta-agent..." autofocus>
    <button id="runBtn" onclick="run()">▶ run</button>
  </div>

  <div class="panels">

    <!-- Steps -->
    <div class="panel">
      <div class="panel-header">steps</div>
      <div class="panel-body" id="stepsPanel">
        <div class="step" id="step-planner"><span class="step-icon">○</span><span class="step-name">planner</span><span class="step-status step-waiting" id="step-planner-status">waiting</span></div>
        <div class="step" id="step-spawner"><span class="step-icon">○</span><span class="step-name">spawner</span><span class="step-status step-waiting" id="step-spawner-status">waiting</span></div>
        <div class="step" id="step-executor"><span class="step-icon">○</span><span class="step-name">executor</span><span class="step-status step-waiting" id="step-executor-status">waiting</span></div>
        <div class="step" id="step-evaluator"><span class="step-icon">○</span><span class="step-name">evaluator</span><span class="step-status step-waiting" id="step-evaluator-status">waiting</span></div>
        <div class="step" id="step-synthesizer"><span class="step-icon">○</span><span class="step-name">synthesizer</span><span class="step-status step-waiting" id="step-synthesizer-status">waiting</span></div>
      </div>
    </div>

    <!-- Agents -->
    <div class="panel">
      <div class="panel-header">agents</div>
      <div class="panel-body" id="agentsPanel">
        <div class="empty-state" id="agentsEmpty">
          <div class="icon">◈</div>
          <div>agents will appear here as they are created</div>
        </div>
      </div>
    </div>

    <!-- Events -->
    <div class="panel">
      <div class="panel-header">events</div>
      <div class="panel-body event-list" id="eventsList">
        <div class="empty-state" id="eventsEmpty" style="padding: 16px;">
          <div>waiting for task...</div>
        </div>
      </div>
    </div>

    <!-- Result -->
    <div class="panel hidden" id="resultPanel">
      <div class="panel-header">result</div>
      <div class="panel-body result-box" id="resultContent"></div>
    </div>

  </div>
</div>

<script>
let currentTaskId = null;
let source = null;
let agentMap = {};

function timestamp() {
  const d = new Date();
  return d.toLocaleTimeString('en-US', { hour12: false });
}

function addEvent(msg, cls = '') {
  const el = document.getElementById('eventsList');
  const empty = document.getElementById('eventsEmpty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'event-entry';
  entry.innerHTML = `<span class="event-time">${timestamp()}</span><span class="event-msg">${cls ? `<span class="${cls}">` : ''}${msg}${cls ? '</span>' : ''}</span>`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}

function setStatus(state) {
  const badge = document.getElementById('statusBadge');
  const dot = badge.querySelector('.dot');
  badge.className = 'status-badge';
  dot.className = 'dot';
  if (state === 'running') {
    badge.classList.add('status-running');
    dot.classList.add('dot-running');
    badge.innerHTML = '<span class="dot dot-running"></span> running';
  } else if (state === 'done') {
    badge.classList.add('status-done');
    dot.classList.add('dot-done');
    badge.innerHTML = '<span class="dot dot-done"></span> done';
  } else if (state === 'failed') {
    badge.classList.add('status-failed');
    dot.classList.add('dot-failed');
    badge.innerHTML = '<span class="dot dot-failed"></span> failed';
  } else {
    badge.classList.add('status-idle');
    dot.classList.add('dot-idle');
    badge.innerHTML = '<span class="dot dot-idle"></span> idle';
  }
}

function setStep(node, status, detail = '') {
  const el = document.getElementById(`step-${node}`);
  if (!el) return;
  const icon = el.querySelector('.step-icon');
  const statusEl = el.querySelector('.step-status');
  icon.textContent = status === 'running' ? '●' : status === 'done' ? '✓' : status === 'failed' ? '✗' : '○';
  el.className = `step step-${status}`;
  statusEl.className = `step-status step-${status}`;
  statusEl.textContent = detail || status;
}

function addAgent(agentId, role, dependsOn = []) {
  const panel = document.getElementById('agentsPanel');
  const empty = document.getElementById('agentsEmpty');
  if (empty) empty.remove();

  if (agentMap[agentId]) return; // already shown

  const card = document.createElement('div');
  card.className = 'agent-card pending';
  card.id = `agent-${agentId}`;
  card.innerHTML = `
    <div class="agent-header">
      <span class="step-icon" id="agent-icon-${agentId}">○</span>
      <span class="agent-name">${agentId}</span>
      <span class="agent-role">${role}</span>
      <span class="agent-status-text" id="agent-status-${agentId}" style="color:#484f58">pending</span>
    </div>
    <div class="agent-tools" id="agent-tools-${agentId}"></div>
    ${dependsOn.length ? `<div class="agent-depends">depends: ${dependsOn.join(', ')}</div>` : ''}
  `;
  panel.appendChild(card);
  agentMap[agentId] = { card, tools: new Set() };
  addEvent(`agent <span class="highlight">${agentId}</span> created (${role})`, '');
}

function setAgentStatus(agentId, status, detail = '') {
  const card = document.getElementById(`agent-${agentId}`);
  if (!card) return;
  const icon = document.getElementById(`agent-icon-${agentId}`);
  const statusEl = document.getElementById(`agent-status-${agentId}`);
  card.className = `agent-card ${status}`;
  icon.textContent = status === 'running' ? '●' : status === 'done' ? '✓' : status === 'failed' ? '✗' : '○';
  statusEl.textContent = detail || status;
  statusEl.style.color = status === 'running' ? '#58a6ff' : status === 'done' ? '#3fb950' : status === 'failed' ? '#f85149' : '#484f58';
}

function addToolCall(agentId, toolName) {
  const container = document.getElementById(`agent-tools-${agentId}`);
  if (!container) return;
  if (agentMap[agentId] && agentMap[agentId].tools.has(toolName)) return;
  agentMap[agentId].tools.add(toolName);
  const chip = document.createElement('span');
  chip.className = 'tool-chip called';
  chip.id = `tool-${agentId}-${toolName.replace(/[^a-zA-Z0-9]/g, '-')}`;
  chip.textContent = `✓ ${toolName}`;
  container.appendChild(chip);
}

function setToolResult(agentId, toolName, success) {
  const id = `tool-${agentId}-${toolName.replace(/[^a-zA-Z0-9]/g, '-')}`;
  const chip = document.getElementById(id);
  if (!chip) return;
  chip.className = `tool-chip ${success ? 'called' : 'errored'}`;
  chip.textContent = `${success ? '✓' : '✗'} ${toolName}`;
}

function showResult(content) {
  const panel = document.getElementById('resultPanel');
  const box = document.getElementById('resultContent');
  panel.classList.remove('hidden');
  box.innerHTML = content;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function run() {
  const input = document.getElementById('goalInput');
  const btn = document.getElementById('runBtn');
  const goal = input.value.trim();
  if (!goal) return;

  btn.disabled = true;
  btn.textContent = '● running';

  // Reset UI
  document.getElementById('taskId').textContent = '—';
  setStatus('idle');
  ['planner','spawner','executor','evaluator','synthesizer'].forEach(n => setStep(n, 'waiting', 'waiting'));
  document.getElementById('agentsPanel').innerHTML = '<div class="empty-state" id="agentsEmpty"><div class="icon">◈</div><div>agents will appear here as they are created</div></div>';
  document.getElementById('eventsList').innerHTML = '<div class="empty-state" id="eventsEmpty" style="padding: 16px;"><div>connecting...</div></div>';
  document.getElementById('resultPanel').classList.add('hidden');
  agentMap = {};
  if (source) { source.close(); source = null; }

  try {
    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    currentTaskId = data.task_id;
    document.getElementById('taskId').textContent = currentTaskId;
    setStatus('running');
    addEvent(`task <span class="highlight">${currentTaskId}</span> started`, 'info');

    connectSSE(currentTaskId);
  } catch (err) {
    addEvent(`failed to start task: ${err.message}`, 'bad');
    btn.disabled = false;
    btn.textContent = '▶ run';
  }
}

function connectSSE(taskId) {
  if (source) source.close();

  source = new EventSource(`/tasks/${taskId}/stream`);

  source.addEventListener('status', (e) => {
    const data = JSON.parse(e.data);
    if (data.status === 'running') setStatus('running');
    else if (data.status === 'done') setStatus('done');
  });

  source.addEventListener('node', (e) => {
    const data = JSON.parse(e.data);
    const node = data.node;
    if (data.status === 'running') {
      setStep(node, 'running', data.agent ? `creating ${data.agent}...` : 'running...');
      if (data.agent) addEvent(`<span class="highlight">spawner</span> → creating ${data.agent}`, 'info');
    } else if (data.status === 'done') {
      const detail = data.output ? `${data.output.length} subtasks` : data.agent ? `${data.agent} done` : 'done';
      setStep(node, 'done', detail);
      if (node === 'planner' && data.output) {
        addEvent(`<span class="highlight">planner</span> → ${data.output.length} subtasks`, 'info');
      }
    }
  });

  source.addEventListener('subtask', (e) => {
    const data = JSON.parse(e.data);
    const agentId = data.agent_id;
    if (data.status === 'running') {
      addAgent(agentId, data.role || 'agent');
      setAgentStatus(agentId, 'running');
      addEvent(`<span class="highlight">${agentId}</span> running`, '');
    } else if (data.status === 'done') {
      setAgentStatus(agentId, 'done', 'done');
      addEvent(`<span class="highlight">${agentId}</span> done ✓`, 'good');
    } else if (data.status === 'retrying') {
      setAgentStatus(agentId, 'running', `retry ${data.attempt}`);
      addEvent(`<span class="highlight">${agentId}</span> retrying (attempt ${data.attempt})`, '');
    }
  });

  source.addEventListener('tool_call', (e) => {
    const data = JSON.parse(e.data);
    addToolCall(data.agent_id, data.tool);
    addEvent(`<span class="highlight">${data.agent_id}</span> → tool: ${data.tool}`, '');
  });

  source.addEventListener('tool_result', (e) => {
    const data = JSON.parse(e.data);
    setToolResult(data.agent_id, data.tool, true);
  });

  source.addEventListener('error', (e) => {
    const data = JSON.parse(e.data);
    const who = data.subtask_id || data.node || 'system';
    addEvent(`<span class="bad">error</span> ${who}: ${data.message}`, 'bad');
    if (data.subtask_id) {
      setAgentStatus(data.subtask_id, 'failed', 'failed');
    }
  });

  source.addEventListener('complete', (e) => {
    const data = JSON.parse(e.data);
    addEvent(`task complete ✓`, 'good');
    showResult(data.result || '');
    setStatus('done');
    cleanup();
  });

  source.onerror = () => {
    // EventSource auto-reconnects; only act if we're not expecting more
    if (source.readyState === EventSource.CLOSED) {
      addEvent('connection closed', '');
      cleanup();
    }
  };
}

function cleanup() {
  if (source) { source.close(); source = null; }
  document.getElementById('runBtn').disabled = false;
  document.getElementById('runBtn').textContent = '▶ run';
}

document.getElementById('goalInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') run();
});
</script>
</body>
</html>
